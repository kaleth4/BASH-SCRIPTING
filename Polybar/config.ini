[colors]
background = #0f141c
foreground = #d8dee9
primary    = #5e81ac
accent     = #a3be8c
alert      = #bf616a
gray       = #4c566a
purple     = #b48ead
cyan       = #88c0d0

# ==========================================
# BARRA IZQUIERDA: Escritorios / Workspaces
# ==========================================
[bar/log]
monitor = ${env:MONITOR:}
width = 10%
height = 26
offset-x = 1%
offset-y = 0.5%
radius = 4.0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"
modules-left = bspwm

# ==========================================
# BARRA CENTRAL: Identificador
# ==========================================
[bar/med]
monitor = ${env:MONITOR:}
width = 14%
height = 26
offset-x = 43%
offset-y = 0.5%
radius = 4.0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
modules-center = banner

# ==========================================
# BARRA DERECHA: Estado e IP de Auditoría
# ==========================================
[bar/top]
monitor = ${env:MONITOR:}
width = 26%
height = 26
offset-x = 73%
offset-y = 0.5%
radius = 4.0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
padding-right = 2
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
modules-right = vpn sep target sep eth

# ==========================================
# CONFIGURACIÓN DETALLADA DE MÓDULOS
# ==========================================

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true

# Iconos limpios de S4vitar para los escritorios
label-focused = "  "
label-focused-foreground = ${colors.accent}
label-occupied = "  "
label-occupied-foreground = ${colors.primary}
label-empty = "  "
label-empty-foreground = ${colors.gray}

[module/banner]
type = custom/text
content = " 拾 KALETH "
content-foreground = ${colors.cyan}

[module/target]
type = custom/script
exec = cat ~/.config/bin/target.txt 2>/dev/null || echo "No Target"
interval = 2
format-prefix = "🎯 "
format-prefix-foreground = ${colors.alert}
label-foreground = ${colors.foreground}

[module/vpn]
type = custom/script
exec = ip addr show tun0 2>/dev/null | grep -oP '(?<=inet\s)\d+(\.\d+){3}' || echo "Disconnected"
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.purple}
label-foreground = ${colors.foreground}

[module/eth]
type = internal/network
interface-type = wired
interval = 3.0
format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %local_ip%
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.alert}
label-disconnected = Off
label-disconnected-foreground = ${colors.gray}

# Módulo separador estético profesional
[module/sep]
type = custom/text
content = "  |  "
content-foreground = ${colors.gray}
